<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="border-radius: 12px; background: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#111d38" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" fill="url(#bgGrad)" rx="12" />
  <rect width="1200" height="340" fill="url(#grid)" rx="12" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS -->
  <!-- Ambient Glow Orbs -->
  <circle cx="950" cy="90" r="130" fill="#3b82f6" opacity="0.18">
    <animate attributeName="r" values="120;145;120" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.14;0.22;0.14" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1100" cy="220" r="110" fill="#8b5cf6" opacity="0.16">
    <animate attributeName="r" values="100;125;100" dur="6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.12;0.20;0.12" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="150" cy="260" r="100" fill="#06b6d4" opacity="0.14">
    <animate attributeName="r" values="90;115;90" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Dynamic Waveform / Telephony Signal Lines (Background Left & Right) -->
  <g opacity="0.25">
    <path d="M 0 280 Q 300 240 600 275 T 1200 260" fill="none" stroke="url(#cyanPurple)" stroke-width="2">
      <animate attributeName="d" 
        values="M 0 280 Q 300 240 600 275 T 1200 260; M 0 270 Q 300 300 600 255 T 1200 275; M 0 280 Q 300 240 600 275 T 1200 260" 
        dur="10s" repeatCount="indefinite" />
    </path>
    <path d="M 0 295 Q 350 320 700 285 T 1200 305" fill="none" stroke="#06b6d4" stroke-width="1.5">
      <animate attributeName="d" 
        values="M 0 295 Q 350 320 700 285 T 1200 305; M 0 305 Q 350 270 700 310 T 1200 290; M 0 295 Q 350 320 700 285 T 1200 305" 
        dur="12s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Dynamic Telephony Activity Card (Top Right - Decorative Behind Title Depth) -->
  <g transform="translate(820, 35)">
    <!-- Card Frame -->
    <rect width="330" height="150" rx="10" fill="#131b2e" stroke="#233554" stroke-width="1.5" opacity="0.9" />
    
    <!-- Header Indicator -->
    <circle cx="22" cy="25" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="29" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="0.5">SIP TRUNK POOL • ACTIVE</text>
    
    <!-- Audio Waveform Visualizer -->
    <g transform="translate(20, 50)">
      <!-- Animated equalizer bars -->
      <rect x="0" y="15" width="4" height="25" rx="2" fill="#06b6d4">
        <animate attributeName="height" values="25;42;15;30;25" dur="1.4s" repeatCount="indefinite" />
        <animate attributeName="y" values="15;0;22;10;15" dur="1.4s" repeatCount="indefinite" />
      </rect>
      <rect x="8" y="8" width="4" height="35" rx="2" fill="#06b6d4">
        <animate attributeName="height" values="35;18;45;20;35" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="y" values="8;20;0;18;8" dur="1.2s" repeatCount="indefinite" />
      </rect>
      <rect x="16" y="20" width="4" height="20" rx="2" fill="#3b82f6">
        <animate attributeName="height" values="20;38;12;40;20" dur="1.6s" repeatCount="indefinite" />
        <animate attributeName="y" values="20;5;25;2;20" dur="1.6s" repeatCount="indefinite" />
      </rect>
      <rect x="24" y="5" width="4" height="42" rx="2" fill="#3b82f6">
        <animate attributeName="height" values="42;22;48;15;42" dur="1.1s" repeatCount="indefinite" />
        <animate attributeName="y" values="5;20;0;24;5" dur="1.1s" repeatCount="indefinite" />
      </rect>
      <rect x="32" y="12" width="4" height="30" rx="2" fill="#8b5cf6">
        <animate attributeName="height" values="30;46;18;35;30" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="y" values="12;0;20;8;12" dur="1.5s" repeatCount="indefinite" />
      </rect>
      <rect x="40" y="18" width="4" height="22" rx="2" fill="#8b5cf6">
        <animate attributeName="height" values="22;14;38;25;22" dur="1.3s" repeatCount="indefinite" />
        <animate attributeName="y" values="18;24;4;15;18" dur="1.3s" repeatCount="indefinite" />
      </rect>
      <rect x="48" y="10" width="4" height="32" rx="2" fill="#ec4899">
        <animate attributeName="height" values="32;44;20;38;32" dur="1.7s" repeatCount="indefinite" />
        <animate attributeName="y" values="10;0;18;6;10" dur="1.7s" repeatCount="indefinite" />
      </rect>

      <!-- Attribution Flow Pill -->
      <g transform="translate(70, 8)">
        <text x="0" y="14" fill="#cbd5e1" font-size="12" font-family="monospace">DNI: Google Ads → +1(800)555-019</text>
        <text x="0" y="32" fill="#64748b" font-size="11">MOS: 4.42 | Latency: 28ms | AI: Live</text>
      </g>
    </g>

    <!-- Mini Progress / Stream bar -->
    <g transform="translate(20, 115)">
      <rect width="290" height="6" rx="3" fill="#1e293b" />
      <rect width="210" height="6" rx="3" fill="url(#cyanPurple)">
        <animate attributeName="width" values="140;270;190;240;140" dur="5s" repeatCount="indefinite" />
      </rect>
      <text x="0" y="24" fill="#94a3b8" font-size="10">RTP Ingest Rate: 1.4k packets/s</text>
      <text x="230" y="24" fill="#10b981" font-size="10" font-weight="600">Attributed</text>
    </g>
  </g>

  <!-- Connected Signaling Node Points with Animated Pulse -->
  <g transform="translate(830, 220)" opacity="0.85">
    <line x1="10" y1="40" x2="100" y2="40" stroke="#334155" stroke-dasharray="4,4" stroke-width="2" />
    <line x1="100" y1="40" x2="190" y2="40" stroke="#334155" stroke-dasharray="4,4" stroke-width="2" />
    <line x1="190" y1="40" x2="280" y2="40" stroke="#334155" stroke-dasharray="4,4" stroke-width="2" />

    <!-- Moving packet on signaling bus -->
    <circle cy="40" r="4" fill="#06b6d4" filter="url(#subtleGlow)">
      <animate attributeName="cx" values="10;280;10" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- Node 1: Inbound Call -->
    <circle cx="10" cy="40" r="14" fill="#1e293b" stroke="#06b6d4" stroke-width="2" />
    <text x="10" y="44" fill="#38bdf8" font-size="11" text-anchor="middle" font-weight="bold">SIP</text>
    <text x="10" y="68" fill="#64748b" font-size="10" text-anchor="middle">Inbound</text>

    <!-- Node 2: DNI Attribution -->
    <circle cx="100" cy="40" r="14" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
    <text x="100" y="44" fill="#60a5fa" font-size="11" text-anchor="middle" font-weight="bold">DNI</text>
    <text x="100" y="68" fill="#64748b" font-size="10" text-anchor="middle">Tracking</text>

    <!-- Node 3: AI Speech -->
    <circle cx="190" cy="40" r="14" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" />
    <text x="190" y="44" fill="#a78bfa" font-size="11" text-anchor="middle" font-weight="bold">AI</text>
    <text x="190" y="68" fill="#64748b" font-size="10" text-anchor="middle">Analysis</text>

    <!-- Node 4: CRM Webhook -->
    <circle cx="280" cy="40" r="14" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <text x="280" y="44" fill="#34d399" font-size="11" text-anchor="middle" font-weight="bold">CRM</text>
    <text x="280" y="68" fill="#64748b" font-size="10" text-anchor="middle">Attributed</text>
  </g>

  <!-- FOREGROUND BRANDING & TYPOGRAPHY (Clear, High Contrast, Foreground Priority) -->
  <g transform="translate(60, 50)">
    <!-- Top Category Badge Pill -->
    <g>
      <rect width="270" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.95" />
      <circle cx="16" cy="14" r="5" fill="#06b6d4">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="18" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1">CURATED TELEPHONY ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="80" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">
      Awesome VoIP &amp; Inbound Call Tracking
    </text>

    <!-- Gradient Subtitle / Tagline -->
    <text x="0" y="114" fill="url(#cyanPurple)" font-size="17" font-weight="600" letter-spacing="0.2">
      Cloud Telephony • Marketing Call Attribution • Open-Source Voice Infrastructure
    </text>

    <!-- Descriptive Pitch -->
    <text x="0" y="146" fill="#94a3b8" font-size="13.5" font-weight="400">
      Enterprise SaaS platforms, self-hosted CPaaS, dynamic number insertion (DNI),
    </text>
    <text x="0" y="168" fill="#94a3b8" font-size="13.5" font-weight="400">
      SIP routing cores, real-time AI conversation intelligence &amp; CDR analytics.
    </text>

    <!-- Interactive Status Badges Bar -->
    <g transform="translate(0, 195)">
      <!-- Badge 1: SaaS Leaders -->
      <rect x="0" y="0" width="135" height="28" rx="6" fill="#131e36" stroke="#1e293b" />
      <text x="10" y="18" fill="#cbd5e1" font-size="11.5" font-weight="500">🏢 SaaS Benchmarks</text>

      <!-- Badge 2: Open Source -->
      <rect x="145" y="0" width="135" height="28" rx="6" fill="#131e36" stroke="#1e293b" />
      <text x="155" y="18" fill="#cbd5e1" font-size="11.5" font-weight="500">⚡ Open Source CPaaS</text>

      <!-- Badge 3: Attribution -->
      <rect x="290" y="0" width="150" height="28" rx="6" fill="#131e36" stroke="#1e293b" />
      <text x="300" y="18" fill="#cbd5e1" font-size="11.5" font-weight="500">🎯 Attribution &amp; DNI</text>

      <!-- Badge 4: Production Ready -->
      <rect x="450" y="0" width="125" height="28" rx="6" fill="#131e36" stroke="#1e293b" />
      <text x="460" y="18" fill="#cbd5e1" font-size="11.5" font-weight="500">🚀 Production Ready</text>
    </g>
  </g>
</svg>
